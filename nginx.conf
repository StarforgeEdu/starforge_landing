map $uri $starforge_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
  /favicon.svg "public, max-age=86400";
  /healthz "no-store";
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests" always;
  add_header Cache-Control $starforge_cache_control always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
  }

  location = /favicon.svg {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
